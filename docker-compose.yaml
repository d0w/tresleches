x-node: &node
  build: .
  image: tresleches-dev
  init: true
  stop_grace_period: 15s
  networks: [mesh]
  volumes:
    - bootstrap:/bootstrap:ro
  tmpfs:
    - /run/tresleches:uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test:
      [
        CMD-SHELL,
        "test -s /bootstrap/seed.addr && routerctl -socket /run/tresleches/router.sock get-status",
      ]
    interval: 5s
    timeout: 4s
    retries: 6
    start_period: 5s

services:
  seed:
    <<: *node
    environment:
      SEED_NODE: "1"
    volumes:
      - bootstrap:/bootstrap

  node-a:
    <<: *node
    depends_on:
      seed:
        condition: service_healthy

  node-b:
    <<: *node
    depends_on:
      seed:
        condition: service_healthy

networks:
  mesh:
    internal: true

volumes:
  bootstrap:
