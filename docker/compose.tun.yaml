name: tresleches-tun

x-node: &node
  build:
    context: ..
    target: tun
  image: tresleches-tun-dev
  init: true
  user: "0:0"
  environment: &tun-environment
    TUN_SUBNET: 10.203.0.0/24
  stop_grace_period: 15s
  networks: [mesh]
  volumes:
    - bootstrap:/bootstrap:ro
  tmpfs:
    - /run/tresleches:uid=0,gid=0,mode=0700
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, NET_RAW]
  devices:
    - /dev/net/tun:/dev/net/tun:rw
  security_opt: [no-new-privileges:true]
  healthcheck:
    test:
      - CMD-SHELL
      - 'test -s /bootstrap/seed.addr && ip -4 addr show dev tl0 up | grep -Fq "inet $$TUN_ADDRESS "'
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 5s

services:
  seed:
    <<: *node
    environment:
      <<: *tun-environment
      SEED_NODE: "1"
      TUN_ADDRESS: 10.203.0.1/32
    volumes:
      - bootstrap:/bootstrap

  node-a:
    <<: *node
    environment:
      <<: *tun-environment
      TUN_ADDRESS: 10.203.0.2/32
    depends_on:
      seed:
        condition: service_healthy

  node-b:
    <<: *node
    environment:
      <<: *tun-environment
      TUN_ADDRESS: 10.203.0.3/32
    depends_on:
      seed:
        condition: service_healthy

networks:
  mesh:
    internal: true

volumes:
  bootstrap:
